name: backend-ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/candidates_test
          JWT_SECRET: super_secret_jwt_key
          AUTH_USERNAME: admin
          AUTH_PASSWORD: admin123
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
      - name: Check coverage threshold
        run: npx jest --config jest.config.cjs --coverage --coverageThreshold='{"global":{"branches":80,"functions":90,"lines":90,"statements":90}}'
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/candidates_test
          JWT_SECRET: super_secret_jwt_key
          AUTH_USERNAME: admin
          AUTH_PASSWORD: admin123
