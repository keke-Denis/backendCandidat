services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/candidates_db
      JWT_SECRET: super_secret_jwt_key
      JWT_EXPIRES_IN: 1h
      AUTH_USERNAME: admin
      AUTH_PASSWORD: admin123
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
